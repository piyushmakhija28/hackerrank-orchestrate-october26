apiVersion: apps/v1
kind: Deployment
metadata:
  name: deletion-audit-agent
  namespace: compliance-workloads
  labels:
    app.kubernetes.io/name: deletion-audit-agent
    app.kubernetes.io/part-of: northstar-compliance
    app.kubernetes.io/version: "2.2.0"
spec:
  replicas: 4
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: deletion-audit-agent
  template:
    metadata:
      labels:
        app.kubernetes.io/name: deletion-audit-agent
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
        - name: audit-agent
          image: northstar/deletion-audit-agent:2.2.0
          imagePullPolicy: IfNotPresent
          resources:
            requests:
              cpu: "500m"
              memory: "256Mi"
            limits:
              cpu: "2000m"
              memory: "1Gi"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: dataset-mount
              mountPath: /app/dataset
              readOnly: true
            - name: output-mount
              mountPath: /app/output
            - name: tmp-mount
              mountPath: /tmp
      volumes:
        - name: dataset-mount
          persistentVolumeClaim:
            claimName: deletion-audit-dataset-pvc
        - name: output-mount
          persistentVolumeClaim:
            claimName: deletion-audit-output-pvc
        - name: tmp-mount
          emptyDir: {}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: deletion-audit-agent-pdb
  namespace: compliance-workloads
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: deletion-audit-agent
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: deletion-audit-agent-hpa
  namespace: compliance-workloads
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: deletion-audit-agent
  minReplicas: 2
  maxReplicas: 16
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
